name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG package
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "Packaging application: $APP_NAME"
          hdiutil create -format UDZO -srcfolder "$APP_NAME" SkyAudit_macOS.dmg
          mv SkyAudit_macOS.dmg ../../../../../SkyAudit_macOS.dmg
          cd ../../../../../

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: SkyAudit_macOS.dmg

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SkyAudit_Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: SkyAudit_Windows.zip

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ottieni tutta la cronologia per calcolare i log corretti

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      # Aggiorna automaticamente il file version.json con la versione di pubspec.yaml e il changelog generato dai commit
      - name: Generate Changelog and Update version.json
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Estrae la versione e il build number da pubspec.yaml
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          VERSION_FULL=${VERSION_LINE#version: }
          VERSION=${VERSION_FULL%+*}
          BUILD_NUMBER=${VERSION_FULL#*+}
          
          echo "Versione estratta: $VERSION"
          echo "Build number estratto: $BUILD_NUMBER"
          
          # Recupera i messaggi dei commit dall'ultimo tag ad oggi
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "Nessun tag precedente trovato, prendo gli ultimi 10 commit."
            COMMITS=$(git log -n 10 --pretty=format:"%s")
          else
            echo "Confronto con il tag precedente: $PREV_TAG"
            COMMITS=$(git log --pretty=format:"%s" $PREV_TAG..HEAD)
          fi
          
          # Converte i commit in un array JSON valido tramite jq (escludendo merge e righe vuote)
          CHANGELOG_JSON=$(echo "$COMMITS" | grep -v -E '^Merge|^$' | jq -R . | jq -s .)
          
          # Genera gli URL corretti per la nuova release
          MACOS_URL="https://github.com/gimox/skyaudit/releases/download/v$VERSION/SkyAudit_macOS.dmg"
          WINDOWS_URL="https://github.com/gimox/skyaudit/releases/download/v$VERSION/SkyAudit_Windows.zip"
          
          # Crea il nuovo file version.json in una cartella temporanea
          jq -n \
            --arg ver "$VERSION" \
            --argjson build "$BUILD_NUMBER" \
            --argjson changelog "$CHANGELOG_JSON" \
            --arg macos "$MACOS_URL" \
            --arg windows "$WINDOWS_URL" \
            '{
              version: $ver,
              buildNumber: $build,
              mandatory: false,
              downloadUrls: {
                macos: $macos,
                windows: $windows,
                web: ""
              },
              changelog: $changelog
            }' > /tmp/version.json
          
          # Passa al branch main, applica le modifiche e invia
          git fetch origin main
          git checkout main
          git pull origin main --rebase
          cp /tmp/version.json version.json
          
          git add version.json
          git commit -m "chore: auto-update version.json to v$VERSION [skip ci]" && git push || echo "Nessuna modifica da inviare"

      # Crea la Release e carica gli asset nel repository
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyAudit_macOS.dmg
            SkyAudit_Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
